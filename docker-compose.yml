name: ottodot

services:
  nginx:
    image: nginx:alpine
    container_name: ottodot-nginx
    restart: unless-stopped
    ports:
      # 8080 by default so it does not clash with XAMPP Apache on :80/:443
      - "${NGINX_PORT:-8080}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
    depends_on:
      - main
    networks:
      - ottodot-net

  main:
    build:
      context: ./main
      target: runner
    container_name: ottodot-main
    restart: unless-stopped
    environment:
      DATABASE_URL: mysql://${MYSQL_USER}:${MYSQL_PASSWORD}@mysql:3306/${MYSQL_DATABASE}
      ALLOW_DEV_RESET: ${ALLOW_DEV_RESET:-false}
      SQL_DIR: /app/sql
    volumes:
      # schema + seed are reused by POST /api/dev/reset
      - ./mysql/init:/app/sql:ro
    expose:
      - "3000"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - ottodot-net

  mysql:
    image: mysql:8.4
    container_name: ottodot-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      TZ: UTC
    ports:
      # 3307 on localhost only, so it does not clash with XAMPP MySQL on :3306
      - "127.0.0.1:${MYSQL_HOST_PORT:-3307}:3306"
    volumes:
      - ./mysql/data:/var/lib/mysql
      - ./mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$$MYSQL_USER -p$$MYSQL_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    networks:
      - ottodot-net

  # Integration tests against the real MySQL (separate ottodot_test database).
  #   docker compose --profile test run --rm test
  test:
    profiles: ["test"]
    build:
      context: ./main
      target: test
    environment:
      DATABASE_URL: mysql://${MYSQL_USER}:${MYSQL_PASSWORD}@mysql:3306/ottodot_test
      SQL_DIR: /app/sql
    volumes:
      - ./mysql/init:/app/sql:ro
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - ottodot-net

networks:
  ottodot-net:
    driver: bridge
